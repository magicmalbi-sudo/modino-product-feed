name: Update Product Feed

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour
  workflow_dispatch: {}    # lets us trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python generate_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/feed.xml
          git diff --quiet --cached || git commit -m "Update product feed"
          git push
